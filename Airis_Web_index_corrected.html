<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Airis.Web</title>
  <meta name="description" content="Airis.Web — a clean web search experience powered by Google Programmable Search.">

  <!-- Airis.Web uses Google Programmable Search for live web results. -->
  <script async src="https://cse.google.com/cse.js?cx=06d9fe6c672f74dcc"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: #202124;
      background: #fff;
    }

    body {
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      padding: 0 28px;
      font-size: 14px;
    }

    .topbar a {
      text-decoration: none;
      color: #5f6368;
    }

    .topbar a:hover {
      text-decoration: underline;
    }

    .signin {
      border: 0;
      border-radius: 7px;
      padding: 10px 17px;
      background: #1a73e8;
      color: white !important;
      font-weight: 600;
      cursor: pointer;
    }

    .hero {
      padding: 46px 20px 30px;
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: baseline;
      font-size: clamp(42px, 9vw, 72px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -4px;
      user-select: none;
    }

    .logo .airis { color: #202124; }
    .logo .dot { color: #1a73e8; }
    .logo .web { color: #5f6368; }

    .tagline {
      margin: 12px 0 24px;
      color: #70757a;
      font-size: 15px;
    }

    .search-form {
      width: min(720px, 100%);
      margin: 0 auto;
      position: relative;
    }

    .search-box {
      width: 100%;
      height: 54px;
      border: 1px solid #dfe1e5;
      border-radius: 28px;
      padding: 0 58px 0 52px;
      font-size: 17px;
      outline: none;
      background: #fff;
      box-shadow: 0 1px 5px rgba(32,33,36,.12);
      transition: box-shadow .15s, border-color .15s;
    }

    .search-box:hover,
    .search-box:focus {
      border-color: transparent;
      box-shadow: 0 1px 7px rgba(32,33,36,.22);
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 16px;
      width: 21px;
      height: 21px;
      color: #70757a;
      pointer-events: none;
    }

    .clear-btn {
      position: absolute;
      right: 58px;
      top: 12px;
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      color: #70757a;
      font-size: 22px;
      cursor: pointer;
      display: none;
    }

    .submit-btn {
      position: absolute;
      right: 8px;
      top: 7px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: #1a73e8;
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .submit-btn svg {
      width: 19px;
      height: 19px;
    }

    .tabs {
      width: min(920px, calc(100% - 32px));
      margin: 24px auto 0;
      border-bottom: 1px solid #e8eaed;
      display: flex;
      justify-content: flex-start;
      gap: 8px;
    }

    .tab {
      padding: 12px 18px;
      color: #5f6368;
      font-size: 14px;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      color: #1a73e8;
      border-bottom-color: #1a73e8;
      font-weight: 600;
    }

    .results-wrap {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 60px;
    }

    .welcome {
      text-align: center;
      padding: 54px 20px;
      color: #70757a;
    }

    .welcome h2 {
      margin: 0 0 10px;
      color: #3c4043;
      font-size: 22px;
      font-weight: 500;
    }

    .welcome p {
      margin: 0;
      line-height: 1.6;
    }

    #google-results {
      width: 100%;
    }

    /* Make Google's injected results blend into Airis.Web. */
    #google-results .gsc-control-cse {
      width: 100% !important;
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      font-family: Arial, Helvetica, sans-serif !important;
    }

    #google-results .gsc-control-cse,
    #google-results .gsc-control-cse * {
      box-sizing: border-box;
    }

    #google-results .gsc-results {
      width: 100% !important;
      padding: 0 !important;
    }

    #google-results .gsc-result {
      border-bottom: 1px solid #e8eaed !important;
      padding: 20px 0 !important;
      margin: 0 !important;
    }

    #google-results .gs-title,
    #google-results .gs-title * {
      color: #1a0dab !important;
      font-size: 19px !important;
      line-height: 1.35 !important;
      text-decoration: none !important;
    }

    #google-results .gs-title:hover,
    #google-results .gs-title:hover * {
      text-decoration: underline !important;
    }

    #google-results .gs-visibleUrl,
    #google-results .gs-visibleUrl-long,
    #google-results .gs-visibleUrl-short {
      color: #188038 !important;
      font-size: 13px !important;
      line-height: 1.5 !important;
    }

    #google-results .gs-snippet {
      color: #4d5156 !important;
      font-size: 14px !important;
      line-height: 1.55 !important;
    }

    #google-results .gsc-thumbnail-inside,
    #google-results .gsc-url-top {
      padding: 0 !important;
    }

    #google-results .gsc-result-info {
      color: #70757a !important;
      font-size: 12px !important;
      padding: 8px 0 12px !important;
    }

    #google-results .gsc-cursor-box {
      margin: 24px 0 !important;
      padding: 12px 0 !important;
      border: 0 !important;
      text-align: center;
    }

    #google-results .gsc-cursor-page {
      display: inline-block;
      margin: 0 5px !important;
      padding: 8px 12px !important;
      border-radius: 18px;
      color: #1a73e8 !important;
      background: #f1f3f4 !important;
      text-decoration: none !important;
    }

    #google-results .gsc-cursor-current-page {
      color: #fff !important;
      background: #1a73e8 !important;
    }

    #google-results .gsc-adBlock {
      margin: 8px 0 12px !important;
    }

    #google-results .gsc-refinementHeader {
      border: 0 !important;
      background: transparent !important;
    }

    .loading {
      display: none;
      text-align: center;
      padding: 25px;
      color: #70757a;
    }

    footer {
      border-top: 1px solid #e8eaed;
      padding: 20px;
      color: #70757a;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .topbar {
        height: 54px;
        padding: 0 14px;
        gap: 14px;
      }

      .topbar a:first-child {
        display: none;
      }

      .hero {
        padding-top: 28px;
      }

      .tagline {
        font-size: 14px;
      }

      .results-wrap,
      .tabs {
        width: min(100% - 24px, 920px);
      }

      #google-results .gs-title,
      #google-results .gs-title * {
        font-size: 17px !important;
      }

      #google-results .gs-snippet {
        font-size: 13px !important;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a href="javascript:void(0)" onclick="focusSearch()">Airis Mail</a>
    <a href="javascript:void(0)" onclick="focusSearch()">Images</a>
    <button class="signin" type="button" onclick="alert('Airis sign-in is coming soon.')">Sign in</button>
  </header>

  <main>
    <section class="hero">
      <div class="logo" aria-label="Airis.Web">
        <span class="airis">Airis</span><span class="dot">.</span><span class="web">Web</span>
      </div>

      <div class="tagline">Search the web with Airis.Web</div>

      <form class="search-form" id="searchForm">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/>
          <path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>

        <input
          id="searchInput"
          class="search-box"
          type="search"
          name="q"
          autocomplete="off"
          placeholder="Search the web..."
          aria-label="Search the web"
        >

        <button class="clear-btn" id="clearBtn" type="button" aria-label="Clear search">×</button>

        <button class="submit-btn" type="submit" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="2"/>
            <path d="M16 16l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>
    </section>

    <nav class="tabs" aria-label="Search type">
      <div class="tab active">Web</div>
    </nav>

    <section class="results-wrap">
      <div class="welcome" id="welcome">
        <h2>Welcome to Airis.Web</h2>
        <p>Type something above to search the web.</p>
      </div>

      <div class="loading" id="loading">Searching the web…</div>

      <!-- Google Results Only element.
           The gname lets Airis.Web trigger searches through Google's API. -->
      <div
        id="google-results"
        class="gcse-searchresults-only"
        data-gname="airisresults"
        data-autoSearchOnLoad="false"
        data-mobileLayout="enabled"
        data-resultSetSize="10"
      ></div>
    </section>
  </main>

  <footer>
    Airis.Web · Live web results powered by Google Programmable Search
  </footer>

  <script>
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const welcome = document.getElementById('welcome');
    const loading = document.getElementById('loading');

    function focusSearch() {
      input.focus();
    }

    function updateClearButton() {
      clearBtn.style.display = input.value ? 'block' : 'none';
    }

    clearBtn.addEventListener('click', () => {
      input.value = '';
      updateClearButton();
      input.focus();
    });

    input.addEventListener('input', updateClearButton);

    function getAirisSearchElement() {
      if (!window.google || !google.search || !google.search.cse || !google.search.cse.element) {
        return null;
      }
      return google.search.cse.element.getElement('airisresults');
    }

    function executeSearch(query) {
      query = query.trim();
      if (!query) {
        input.focus();
        return;
      }

      const element = getAirisSearchElement();

      if (!element) {
        loading.style.display = 'block';
        setTimeout(() => executeSearch(query), 250);
        return;
      }

      welcome.style.display = 'none';
      loading.style.display = 'none';

      const url = new URL(window.location.href);
      url.searchParams.set('q', query);
      window.history.pushState({ q: query }, '', url);

      element.execute(query);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      executeSearch(input.value);
    });

    window.addEventListener('popstate', () => {
      const q = new URLSearchParams(window.location.search).get('q') || '';
      input.value = q;
      updateClearButton();
      if (q) executeSearch(q);
    });

    window.addEventListener('load', () => {
      const q = new URLSearchParams(window.location.search).get('q') || '';
      if (q) {
        input.value = q;
        updateClearButton();
        executeSearch(q);
      }
    });
  </script>
</body>
</html>
